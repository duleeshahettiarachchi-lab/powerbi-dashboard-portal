<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Full-page Power BI dashboard viewer.">
  <title>Dashboard Viewer | Power BI Dashboard Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=20260805-5">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .viewer-page,
    .viewer-shell {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .viewer-stage {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    .viewer-stage iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>
<body class="viewer-page">
  <div class="viewer-shell">
    <main class="viewer-stage" id="viewerStage"></main>
  </div>

  <script src="js/dashboard-config.js?v=20260805-5"></script>
  <script src="js/app.js?v=20260805-5"></script>
</body>
</html>
