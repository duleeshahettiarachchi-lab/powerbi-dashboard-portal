<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dashboard launch page.">
  <title>Dashboard Viewer | Dashboard Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=20260908-26">
  <script src="js/auth-config.js?v=20260908-3"></script>
  <script src="js/auth.js?v=20260909-roles"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .viewer-page,
    .viewer-shell {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .viewer-stage {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
    }

    @media screen and (orientation: portrait) {
      .viewer-stage {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
  <meta name="theme-color" content="#12345a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <script src="js/pwa.js" defer></script>
</head>
<body class="viewer-page">
  <div class="viewer-shell">
    <main class="viewer-stage" id="viewerStage"></main>
  </div>

  <script src="js/dashboard-config.js?v=20260901-9"></script>
  <script src="js/app.js?v=20260908-4"></script>
</body>
</html>
