<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Dashboard Portal Home">
          <div class="brand-mark"><img src="assets/ABM%20logo.png?v=20260916" alt="ABM"></div>
          <div class="brand-copy">
            <strong>Associated Battery</strong>
            <strong>Manufacturers (Ceylon) Limited</strong>
          </div>
        </a>
        <nav class="site-nav" aria-label="Main navigation">

          <a href="index.html">Dashboards</a>
          <a class="active" aria-current="page" href="value-stream-maps.html">Value Stream Maps</a>

    <main>
      <section class="page-banner"><div class="page-banner-inner"><h1>Value Stream Maps</h1></div></section>

        <div class="dashboard-toolbar">
          <label class="search-box"><span class="search-icon">&#8981;</span><input id="vsmSearch" type="search" placeholder="Search value stream maps..." aria-label="Search value stream maps"></label>
          <div class="count-pill" id="vsmCount">3 value stream maps</div>

        <div class="dashboard-grid vsm-grid" id="vsmGrid"></div>
        <p id="vsmEmpty" hidden>No value stream map matches your search.</p>
      </section>
      <dialog id="vsmPlayer" aria-labelledby="vsmPlayerTitle">
        <div class="vsm-player-heading"><h2 id="vsmPlayerTitle"></h2><button type="button" id="vsmClose" class="btn">Close video</button></div>
        <video id="vsmVideo" controls playsinline preload="metadata">Your browser does not support video playback.</video>
      </dialog>
    </main>

    <footer class="site-footer">
      <div class="footer-inner footer-inner-credit-only">
        <div class="footer-credit footer-credit-logo">
