name: Update Smart TV Snapshot Previews

on:
  schedule:
    # Daily schedule. Change this cron when the snapshot time needs to move.
    # Runs at 09:02 Sri Lanka time, which is 03:32 UTC.
    - cron: "32 3 * * *"
  workflow_dispatch:
    inputs:
      dashboard_id:
        description: "Optional dashboard ID to capture. Leave blank to capture all dashboards."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show workflow time
        run: |
          echo "Workflow event: ${{ github.event_name }}"
          echo "UTC time: $(date -u)"
          TZ=Asia/Colombo date "+Sri Lanka time: %Y-%m-%d %H:%M:%S %Z"

      - name: Capture all dashboard snapshots
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dashboard_id == '' }}
        run: npm run capture:snapshots

      - name: Capture one dashboard snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dashboard_id != '' }}
        run: npm run capture:snapshots:one -- "${{ inputs.dashboard_id }}"

      - name: Commit updated snapshots and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update Smart TV dashboard snapshots"
            git push origin HEAD:main
          fi
