<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dashboard portal access screen.">
  <title>Access | Dashboard Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=20260908-26">
  <script src="js/auth-config.js?v=20260908-3"></script>
  <script src="js/auth.js?v=20260909-roles"></script>
  <meta name="theme-color" content="#12345a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <script src="js/pwa.js" defer></script>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <img src="assets/ABM_logo_exact.png?v=20260908-1" alt="ABM">
        <div>
          <strong>Exide Battery Manufacturers</strong>
          <span>BI Dashboards</span>
        </div>
      </div>

      <form id="authForm" class="auth-form">
        <label for="authPassword">Password</label>
        <div class="password-field">
          <input id="authPassword" type="password" autocomplete="current-password" autofocus required>
          <button id="togglePassword" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
            <span class="password-toggle-icon" aria-hidden="true"></span>
          </button>
        </div>
        <button class="btn btn-primary" type="submit">Open Portal</button>
        <div class="auth-error" id="authError" aria-live="polite"></div>
      </form>
    </section>
  </main>
</body>
</html>
